# Atlas — local infrastructure (based on the /platform compose file supplied with the task).
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# Host ports are overridable, because 1433 is very often already taken:
#   SQL_PORT=14330 docker compose -f infra/docker-compose.yml up -d --wait
#
# Added for Atlas (all from the allowed list):
#   rabbitmq  — broker between Onboarding and Accounts (ADR-0004)
#   azurite   — blob storage for identity documents, one container per market (ADR-0009)

name: atlas

services:

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck", "--loose", "--location", "/data"]
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

volumes:
  sql-data:
  seq-data:
  rabbitmq-data:
  azurite-data:
